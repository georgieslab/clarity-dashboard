    let currentSlide = 0;
    let notesVisible = false;

    function renderSlide() {
      const slide = SLIDES[currentSlide];
      const container = document.getElementById('slide-container');
      
      container.className = '';
      void container.offsetWidth; // Trigger reflow
      container.className = 'slide-enter w-full';

      if (slide.isCover) {
        container.innerHTML = slide.content;
      } else {
        container.innerHTML = `
          <div class="mb-4">
            <span class="text-xs font-bold tracking-widest uppercase text-cyan-400 mb-1 inline-block font-mono">${slide.badge}</span>
            <h2 class="text-xl md:text-2xl font-black text-white tracking-tight leading-tight">${slide.title}</h2>
            <p class="text-xs md:text-sm text-slate-300 mt-1 max-w-3xl">${slide.subtitle}</p>
          </div>
          ${slide.content}
        `;
      }

      // Update slide number and navigation pills
      document.getElementById('current-slide-num').textContent = currentSlide + 1;
      document.querySelectorAll('.slide-nav-btn').forEach((btn, idx) => {
        if (idx === currentSlide) {
          btn.className = 'slide-nav-btn text-xs font-bold px-3 py-1 rounded-full bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-md shadow-cyan-500/30';
        } else {
          btn.className = 'slide-nav-btn text-xs font-medium px-3 py-1 rounded-full text-slate-400 hover:text-white transition-all';
        }
      });

      // Update notes
      document.getElementById('notes-title').textContent = slide.isCover ? 'Presentation Introduction' : `Slide ${currentSlide}: ${slide.title}`;
      document.getElementById('notes-content').textContent = slide.notes;
    }

    function nextSlide() {
      if (currentSlide < SLIDES.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function goToSlide(index) {
      if (index >= 0 && index < SLIDES.length) {
        currentSlide = index;
        renderSlide();
      }
    }

    function toggleNotes() {
      notesVisible = !notesVisible;
      const drawer = document.getElementById('notes-drawer');
      const btn = document.getElementById('notes-toggle-btn');
      if (notesVisible) {
        drawer.classList.remove('hidden');
        btn.classList.add('bg-cyan-500/20', 'border-cyan-500', 'text-cyan-300');
      } else {
        drawer.classList.add('hidden');
        btn.classList.remove('bg-cyan-500/20', 'border-cyan-500', 'text-cyan-300');
      }
    }

    // Keyboard Navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key.toLowerCase() === 's' || e.key.toLowerCase() === 'n') {
        toggleNotes();
      }
    });

    // Initialize presentation
    renderSlide();
  </script>
