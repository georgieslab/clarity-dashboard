      document.querySelectorAll('.slide-nav-btn').forEach((btn, idx) => {
        if (idx === currentSlide) {
          btn.className = 'slide-nav-btn text-xs font-bold px-3 py-1 rounded-full bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-md shadow-cyan-500/30';
        } else {
          btn.className = 'slide-nav-btn text-xs font-semibold px-3 py-1 rounded-full text-slate-400 hover:text-white transition-all';
        }
      });

      // Update notes
      document.getElementById('notes-title').textContent = `Slide ${currentSlide + 1}: ${slide.title}`;
      document.getElementById('notes-content').textContent = slide.notes;
    }

    function nextSlide() {
      if (currentSlide < SLIDES.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function goToSlide(index) {
      if (index >= 0 && index < SLIDES.length) {
        currentSlide = index;
        renderSlide();
      }
    }

    function toggleNotes() {
      notesVisible = !notesVisible;
      const drawer = document.getElementById('notes-drawer');
      const btn = document.getElementById('notes-toggle-btn');
      if (notesVisible) {
        drawer.classList.remove('hidden');
        btn.classList.add('bg-cyan-500/20', 'border-cyan-500', 'text-cyan-300');
      } else {
        drawer.classList.add('hidden');
        btn.classList.remove('bg-cyan-500/20', 'border-cyan-500', 'text-cyan-300');
      }
    }

    // Keyboard Navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key.toLowerCase() === 's' || e.key.toLowerCase() === 'n') {
        toggleNotes();
      }
    });

    // Initialize presentation
    renderSlide();
  </script>
</body>
</html>
