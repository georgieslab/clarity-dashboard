<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant Violet-Cyan Fluid Gradient -->
    <linearGradient id="clarity-cyan-violet" x1="6" y1="8" x2="58" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Warm Pink-Magenta Prism Gradient -->
    <linearGradient id="clarity-violet-pink" x1="56" y1="12" x2="10" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Center Crystalline Glow -->
    <radialGradient id="clarity-core-glow" cx="32" cy="32" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Drop Shadow & Bloom Filters -->
    <filter id="clarity-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="32" cy="32" r="24" fill="url(#clarity-core-glow)" opacity="0.35" filter="url(#clarity-glow)"/>

  <!-- Primary Outer Telemetry Ribbon (Stylized C / Mindful Aperture) -->
  <path d="M32 7C45.8 7 57 18.2 57 32C57 45.8 45.8 57 32 57C18.2 57 7 45.8 7 32C7 23.5 11.2 16 17.6 11.5C18.9 10.6 20.8 11.5 20.6 13.1C20.1 16.5 22.8 19.5 26.3 19.5C28.2 19.5 29.9 18.6 31 17.2C33.2 14.4 32.1 10.3 29.5 8.8C30.3 8.7 31.1 8.6 32 8.6C44.9 8.6 55.4 19.1 55.4 32C55.4 44.9 44.9 55.4 32 55.4C19.1 55.4 8.6 44.9 8.6 32C8.6 24.8 11.9 18.3 17 14.1" 
        stroke="url(#clarity-cyan-violet)" 
        stroke-width="3.2" 
        stroke-linecap="round"/>

  <!-- Counter-Flowing Crystalline Loop (Lucid Focus Arch) -->
  <path d="M47.5 18.5C51.6 22.3 54.2 27.8 54.2 33.8C54.2 45.5 44.5 55 32.5 55C21.8 55 13 46.8 11.2 36.5C10.9 34.8 12.3 33.3 14 33.4C17.2 33.6 20 30.8 19.8 27.6C19.6 25.8 20.8 24.2 22.6 24C30.5 23 37.5 17.5 40.5 10C41.2 8.3 43.4 7.8 44.8 9C49.5 13 52.8 18.5 53.8 24.8" 
        stroke="url(#clarity-violet-pink)" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        opacity="0.85"/>

  <!-- Inner Dynamic Focus Prism Rings -->
  <ellipse cx="32" cy="32" rx="14" ry="14" 
           stroke="url(#clarity-cyan-violet)" 
           stroke-width="1.8" 
           stroke-dasharray="2 3" 
           opacity="0.6"/>

  <!-- Core Crystalline Clarity Diamond Spark -->
  <path d="M32 16L34.8 28.5L46 32L34.8 35.5L32 48L29.2 35.5L18 32L29.2 28.5Z" 
        fill="url(#clarity-core-glow)"/>

  <!-- Micro Spark Highlight Accent -->
  <circle cx="32" cy="32" r="3.2" fill="#ffffff" filter="url(#clarity-glow)"/>
  <circle cx="33.2" cy="30.8" r="1.2" fill="#ffffff"/>
</svg>