<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/clarity.svg" />
    <link rel="apple-touch-icon" href="/clarity.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Primary Manifest & Meta Tags -->
    <title>Clarity — Executive Life & Growth Telemetry</title>
    <meta name="description" content="High-performance executive life, career, and sobriety telemetry dashboard with multimodal AI copilot." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)" />

    <!-- Apple Web App Capabilities (iOS standalone & fullscreen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clarity" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Clarity" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Service Worker Registration for PWA Offline Resilience
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('⚡ Clarity PWA Service Worker registered:', reg.scope);
            })
            .catch(err => {
              console.warn('Service worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
